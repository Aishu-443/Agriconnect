services:
  postgres:
    image: postgres:16
    container_name: agriconnect-postgres
    environment:
      POSTGRES_DB: agriconnect_db
      POSTGRES_USER: agriconnect_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - agriconnect-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agriconnect_user -d agriconnect_db"]
      interval: 10s
      timeout: 5s
      retries: 5
  frontend:
    image: nginx:alpine
    container_name: agriconnect-frontend
    ports:
      - "8081:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - agriconnect-backend
      - weather-service
    networks:
      - agriconnect-network

  agriconnect-backend:
    build: ./agriconnect-backend
    container_name: agriconnect-backend
    ports:
      - "8083:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/agriconnect_db
      SPRING_DATASOURCE_USERNAME: agriconnect_user
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agriconnect-network
  weather-service:
    build: ./weather-service
    container_name: agriconnect-weather
    ports:
      - "5000:5000"
    networks:
      - agriconnect-network

volumes:
  postgres_data:

networks:
  agriconnect-network:
    driver: bridge

