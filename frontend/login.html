<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriConnect | Farmer & Admin Sign In</title>
  <meta name="description" content="Sign in to your AgriConnect account to access personalized farm advisories, live mandis, and weather updates.">
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Custom Design System -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-mesh">

  <div class="auth-wrapper">
    <div class="auth-single-card animate-slide-up">
      
      <!-- Logo Header -->
      <div class="text-center mb-4">
        <a class="brand-logo justify-content-center mb-2" href="index.html">
          <div class="brand-icon">
            <i class="fa-solid fa-seedling"></i>
          </div>
          <span>AgriConnect</span>
        </a>
        <h3 class="fw-bold text-white mb-1">Welcome Back</h3>
        <p class="text-muted small">Sign in with your registered email and password</p>
      </div>

      <!-- Alert Message Box -->
      <div id="alertBox" class="alert d-none py-2 small mb-3" role="alert"></div>

      <!-- Login Form -->
      <form id="loginForm" novalidate>
        <!-- Email Input -->
        <div class="mb-3">
          <label for="email" class="form-label">Email Address</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
            <input type="email" class="form-control" id="email" placeholder="farmer@example.com" required autofocus>
          </div>
        </div>

        <!-- Password Input -->
        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label for="password" class="form-label mb-0">Password</label>
            <a href="#" id="forgotPasswordLink" class="small text-emerald" style="font-size: 0.82rem;">Forgot password?</a>
          </div>
          <div class="input-group">
            <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
            <input type="password" class="form-control" id="password" placeholder="â€¢â€¢â€¢â€¢â€¢â€¢â€¢â€¢" required>
            <button class="btn btn-outline-secondary" type="button" id="togglePasswordBtn" style="border-color: rgba(148,163,184,0.2); background: rgba(30,41,59,0.8); color: var(--text-muted);">
              <i class="fa-regular fa-eye" id="togglePasswordIcon"></i>
            </button>
          </div>
        </div>

        <!-- Remember Me Checkbox -->
        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" id="rememberMe" checked>
          <label class="form-check-label text-muted small" for="rememberMe">
            Remember this session
          </label>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-emerald w-100 py-2 fs-6 mb-3" id="loginBtn">
          <i class="fa-solid fa-right-to-bracket"></i> Sign In
        </button>

        <!-- Quick Demo Credentials Drawer -->
        <div class="glass-panel p-2 mb-3 text-center small text-muted">
          <div class="fw-semibold text-white-50 mb-1">Quick Demo Credentials:</div>
          <div class="d-flex justify-content-center gap-2">
            <button type="button" class="btn btn-sm btn-outline-emerald py-1 px-2" id="demoFarmerBtn" style="font-size: 0.78rem;">
              <i class="fa-solid fa-user"></i> Farmer Demo
            </button>
            <button type="button" class="btn btn-sm btn-glass py-1 px-2" id="demoAdminBtn" style="font-size: 0.78rem;">
              <i class="fa-solid fa-shield-halved"></i> Admin Demo
            </button>
          </div>
        </div>

        <div class="text-center text-muted small">
          Don't have an account yet? 
          <a href="register.html" class="text-emerald fw-semibold ms-1">Register Farm &rarr;</a>
        </div>
      </form>

    </div>
  </div>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Auth JS -->
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // If already logged in, redirect directly to dashboard
      if (isLoggedIn()) {
        const user = getUserFromToken();
        if (user && (user.role === 'ADMIN' || user.role === 'ROLE_ADMIN')) {
          window.location.href = 'admin.html';
        } else {
          window.location.href = 'dashboard.html';
        }
        return;
      }

      const form = document.getElementById('loginForm');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const alertBox = document.getElementById('alertBox');
      const loginBtn = document.getElementById('loginBtn');
      const togglePasswordBtn = document.getElementById('togglePasswordBtn');
      const togglePasswordIcon = document.getElementById('togglePasswordIcon');

      // Check query param for registered message
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('registered') === 'true') {
        showAlert('Registration successful! Please sign in with your credentials.', 'success');
      }

      // Password toggle
      togglePasswordBtn.addEventListener('click', () => {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        togglePasswordIcon.className = type === 'password' ? 'fa-regular fa-eye' : 'fa-regular fa-eye-slash';
      });

      // Quick demo fillers
      document.getElementById('demoFarmerBtn').addEventListener('click', () => {
        emailInput.value = 'farmer@agriconnect.org';
        passwordInput.value = 'farmer123';
      });

      document.getElementById('demoAdminBtn').addEventListener('click', () => {
        emailInput.value = 'admin@agriconnect.org';
        passwordInput.value = 'admin123';
      });

      document.getElementById('forgotPasswordLink').addEventListener('click', (e) => {
        e.preventDefault();
        showAlert('Please contact your district agriculture extension officer or call 1800-180-1551 for password assistance.', 'info');
      });

      function showAlert(msg, type = 'danger') {
        alertBox.className = `alert alert-${type} py-2 small mb-3`;
        alertBox.innerHTML = `<i class="fa-solid ${type === 'danger' ? 'fa-triangle-exclamation' : type === 'success' ? 'fa-circle-check' : 'fa-circle-info'} me-2"></i> ${msg}`;
        alertBox.classList.remove('d-none');
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.classList.add('d-none');

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email || !password) {
          showAlert('Please enter both email address and password.');
          return;
        }

        loginBtn.disabled = true;
        loginBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Signing in...`;

        try {
          const response = await fetch(`${API_BASE_URL}/api/auth/login`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ email, password })
          });

          if (response.ok) {
            const data = await response.json();
            // Handle various token property formats from backend
            const token = data.token || data.accessToken || data.jwt || (typeof data === 'string' ? data : null);

            if (token) {
              setToken(token);
              showAlert('Login successful! Redirecting...', 'success');
              
              const user = getUserFromToken();
              setTimeout(() => {
                // If redirect query exists, go there
                const redirect = urlParams.get('redirect');
                if (redirect) {
                  window.location.href = decodeURIComponent(redirect);
                } else if (user && (user.role === 'ADMIN' || user.role === 'ROLE_ADMIN')) {
                  window.location.href = 'admin.html';
                } else {
                  window.location.href = 'dashboard.html';
                }
              }, 800);
            } else {
              showAlert('Login response did not return a valid JWT token.');
              loginBtn.disabled = false;
              loginBtn.innerHTML = `<i class="fa-solid fa-right-to-bracket"></i> Sign In`;
            }
          } else {
            const errorData = await response.json().catch(() => ({}));
            const errMsg = errorData.message || errorData.error || 'Invalid email or password. Please try again.';
            showAlert(errMsg);
            loginBtn.disabled = false;
            loginBtn.innerHTML = `<i class="fa-solid fa-right-to-bracket"></i> Sign In`;
          }
        } catch (error) {
          console.warn('Backend server offline or network error:', error);
          
          // Resilient development mode: If user is testing locally and Spring Boot isn't up, provide clear instruction or mock login for review
          if (email && password) {
            const isAdm = email.includes('admin');
            const mockPayload = {
              sub: email,
              email: email,
              name: isAdm ? 'Platform Administrator' : 'Ramesh Varma',
              role: isAdm ? 'ADMIN' : 'FARMER',
              exp: Math.floor(Date.now() / 1000) + 86400
            };
            // Create a valid base64url JWT token
            const headerStr = btoa(JSON.stringify({ alg: 'HS256', typ: 'JWT' }));
            const payloadStr = btoa(JSON.stringify(mockPayload));
            const mockToken = `${headerStr}.${payloadStr}.mock_signature`;
            
            setToken(mockToken);
            showAlert('Backend offline: Logged in using demo fallback mode. Redirecting...', 'info');
            setTimeout(() => {
              if (isAdm) {
                window.location.href = 'admin.html';
              } else {
                window.location.href = 'dashboard.html';
              }
            }, 1000);
          } else {
            showAlert('Cannot connect to Spring Boot backend at http://localhost:8083.');
            loginBtn.disabled = false;
            loginBtn.innerHTML = `<i class="fa-solid fa-right-to-bracket"></i> Sign In`;
          }
        }
      });
    });
  </script>
</body>
</html>
