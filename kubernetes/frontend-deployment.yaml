apiVersion: apps/v1
kind: Deployment
metadata:
  name: agriconnect-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agriconnect-frontend
  template:
    metadata:
      labels:
        app: agriconnect-frontend
    spec:
      containers:
      - name: frontend
        image: aishvitha/agriconnect-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 20
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
