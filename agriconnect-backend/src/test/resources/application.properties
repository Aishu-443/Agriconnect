spring.application.name=agriconnect-backend-test

# In-memory H2 database used only by automated tests
spring.datasource.url=jdbc:h2:mem:agriconnect_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# data.sql is written for PostgreSQL, so it is not loaded in tests
spring.sql.init.mode=never

# Dummy values that exist only for the test run
jwt.secret=${JWT_SECRET:test-only-secret-key-that-is-at-least-32-bytes-long}
jwt.expiration=3600000
app.admin.password=

