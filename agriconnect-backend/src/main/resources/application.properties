spring.application.name=agriconnect-backend
server.port=8080

# Database (credentials are supplied through environment variables)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/agriconnect_db}
spring.datasource.username=${DB_USERNAME:agriconnect_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA (set to create-drop for initial setup, can change to update for production)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# SQL Init
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# JWT (value must be supplied through the JWT_SECRET environment variable)
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Initial admin account password (supplied through ADMIN_PASSWORD; admin login stays disabled if empty)
app.admin.password=${ADMIN_PASSWORD:}
